<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>AgentDojo prompt-injection attacks, with and without Mirage</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="80.0" y="96.0" font-size="44" font-weight="600" fill="#111111" text-anchor="start">AgentDojo: prompt-injection attacks</text><text x="80.0" y="140.0" font-size="22" font-weight="400" fill="#6b6b6b" text-anchor="start">Tuning tasks only (held-out run not in yet) · 20 attacked tasks per bar</text><text x="80.0" y="818.0" font-size="21" font-weight="400" fill="#6b6b6b" text-anchor="start">Each task hides instructions from an attacker in data the agent reads, like a message or a web page.</text><text x="80.0" y="852.0" font-size="21" font-weight="500" fill="#111111" text-anchor="start">With Mirage, 3 of 20 attacks succeeded instead of 11 of 20; the user&#x27;s task was still done in 4 of 20 (vs 8 of 20 without).</text><text x="80.0" y="214.0" font-size="26" font-weight="600" fill="#111111" text-anchor="start">Attacks that succeeded</text><text x="80.0" y="246.0" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="start">lower is better</text><line x1="80.0" y1="700.0" x2="760.0" y2="700.0" stroke="#d4d4d4" stroke-width="1"/><rect x="170.0" y="480.0" width="200.0" height="220.0" fill="#c8c8c8"/><line x1="270.0" y1="403.3" x2="270.0" y2="563.2" stroke="#9a9a9a" stroke-width="1"/><line x1="265.0" y1="403.3" x2="275.0" y2="403.3" stroke="#9a9a9a" stroke-width="1"/><line x1="265.0" y1="563.2" x2="275.0" y2="563.2" stroke="#9a9a9a" stroke-width="1"/><text x="270.0" y="387.3" font-size="44" font-weight="600" fill="#111111" text-anchor="middle">55%</text><text x="270.0" y="736.0" font-size="20" font-weight="400" fill="#111111" text-anchor="middle">GPT-OSS-20B</text><rect x="470.0" y="640.0" width="200.0" height="60.0" fill="#0f7b6c"/><line x1="570.0" y1="555.8" x2="570.0" y2="679.1" stroke="#9a9a9a" stroke-width="1"/><line x1="565.0" y1="555.8" x2="575.0" y2="555.8" stroke="#9a9a9a" stroke-width="1"/><line x1="565.0" y1="679.1" x2="575.0" y2="679.1" stroke="#9a9a9a" stroke-width="1"/><text x="570.0" y="539.8" font-size="44" font-weight="600" fill="#111111" text-anchor="middle">15%</text><text x="570.0" y="736.0" font-size="20" font-weight="500" fill="#111111" text-anchor="middle">GPT-OSS-20B + Mirage</text><text x="840.0" y="214.0" font-size="26" font-weight="600" fill="#111111" text-anchor="start">User&#x27;s task still completed</text><text x="840.0" y="246.0" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="start">higher is better</text><line x1="840.0" y1="700.0" x2="1520.0" y2="700.0" stroke="#d4d4d4" stroke-width="1"/><rect x="930.0" y="540.0" width="200.0" height="160.0" fill="#c8c8c8"/><line x1="1030.0" y1="454.6" x2="1030.0" y2="612.5" stroke="#9a9a9a" stroke-width="1"/><line x1="1025.0" y1="454.6" x2="1035.0" y2="454.6" stroke="#9a9a9a" stroke-width="1"/><line x1="1025.0" y1="612.5" x2="1035.0" y2="612.5" stroke="#9a9a9a" stroke-width="1"/><text x="1030.0" y="438.6" font-size="44" font-weight="600" fill="#111111" text-anchor="middle">40%</text><text x="1030.0" y="736.0" font-size="20" font-weight="400" fill="#111111" text-anchor="middle">GPT-OSS-20B</text><rect x="1230.0" y="620.0" width="200.0" height="80.0" fill="#0f7b6c"/><line x1="1330.0" y1="533.6" x2="1330.0" y2="667.7" stroke="#9a9a9a" stroke-width="1"/><line x1="1325.0" y1="533.6" x2="1335.0" y2="533.6" stroke="#9a9a9a" stroke-width="1"/><line x1="1325.0" y1="667.7" x2="1335.0" y2="667.7" stroke="#9a9a9a" stroke-width="1"/><text x="1330.0" y="517.6" font-size="44" font-weight="600" fill="#111111" text-anchor="middle">20%</text><text x="1330.0" y="736.0" font-size="20" font-weight="500" fill="#111111" text-anchor="middle">GPT-OSS-20B + Mirage</text></g></svg>
