<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>AgentDojo prompt-injection attacks, with and without Mirage</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="80.0" y="96.0" font-size="44" font-weight="600" fill="#111111" text-anchor="start">AgentDojo: prompt-injection attacks</text><text x="80.0" y="140.0" font-size="22" font-weight="400" fill="#6b6b6b" text-anchor="start">Held-out tasks · 20 attacked and 10 normal tasks per bar</text><text x="80.0" y="818.0" font-size="21" font-weight="400" fill="#6b6b6b" text-anchor="start">Each attacked task hides an attacker&#x27;s instructions in data the agent reads, like a message or a web page.</text><text x="80.0" y="852.0" font-size="21" font-weight="500" fill="#111111" text-anchor="start">Mirage cut successful attacks from 30 of 80 to 2 of 80, but fewer tasks got done (36 vs 64 of 80 attacked, 24 vs 37 of 40 normal).</text><text x="80.0" y="214.0" font-size="26" font-weight="600" fill="#111111" text-anchor="start">Attacks that succeeded</text><text x="80.0" y="246.0" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="start">lower is better</text><line x1="230.0" y1="276.0" x2="230.0" y2="636.0" stroke="#d4d4d4" stroke-width="1"/><text x="214.0" y="307.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-20B</text><rect x="230.0" y="286.0" width="137.5" height="30.0" fill="#c8c8c8"/><text x="379.5" y="309.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">55%</text><text x="214.0" y="343.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="230.0" y="322.0" width="3.0" height="30.0" fill="#0f7b6c"/><text x="245.0" y="345.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">0%</text><text x="214.0" y="399.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-