<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>AgentDojo prompt-injection attacks, with and without Mirage</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="80.0" y="96.0" font-size="44" font-weight="600" fill="#111111" text-anchor="start">AgentDojo: prompt-injection attacks</text><text x="80.0" y="140.0" font-size="22" font-weight="400" fill="#6b6b6b" text-anchor="start">Held-out tasks · 20 attacked tasks per bar</text><text x="80.0" y="818.0" font-size="21" font-weight="400" fill="#6b6b6b" text-anchor="start">Each task hides instructions from an attacker in data the agent reads, like a message or a web page.</text><text x="80.0" y="852.0" font-size="21" font-weight="500" fill="#111111" text-anchor="start">Across all models, Mirage cut successful attacks from 30 of 80 to 2 of 80; the user&#x27;s task was done in 36 of 80 with Mirage vs 64 of 80 without.</text><text x="80.0" y="214.0" font-size="26" font-weight="600" fill="#111111" text-anchor="start">Attacks that succeeded</text><text x="80.0" y="246.0" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="start">lower is better</text><line x1="310.0" y1="276.0" x2="310.0" y2="636.0" stroke="#d4d4d4" stroke-width="1"/><text x="294.0" y="307.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-20B</text><rect x="310.0" y="286.0" width="209.0" height="30.0" fill="#c8c8c8"/><line x1="440.0" y1="301.0" x2="591.9" y2="301.0" stroke="#9a9a9a" stroke-width="1"/><text x="603.9" y="309.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">55%</text><text x="294.0" y="343.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="310.0" y="322.0" width="3.0" height="30.0" fill="#0f7b6c"/><line x1="310.0" y1="337.0" x2="371.2" y2="337.0" stroke="#9a9a9a" stroke-width="1"/><text x="383.2" y="345.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">0%</text><text x="294.0" y="399.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-120B</text><rect x="310.0" y="378.0" width="361.0" height="30.0" fill="#c8c8c8"/><line x1="600.3" y1="393.0" x2="686.6" y2="393.0" stroke="#9a9a9a" stroke-width="1"/><text x="698.6" y="401.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">95%</text><text x="294.0" y="435.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="310.0" y="414.0" width="38.0" height="30.0" fill="#0f7b6c"/><line x1="320.6" y1="429.0" x2="424.4" y2="429.0" stroke="#9a9a9a" stroke-width="1"/><text x="436.4" y="437.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">10%</text><text x="294.0" y="491.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">Haiku 4.5</text><rect x="310.0" y="470.0" width="3.0" height="30.0" fill="#c8c8c8"/><line x1="310.0" y1="485.0" x2="371.2" y2="485.0" stroke="#9a9a9a" stroke-width="1"/><text x="383.2" y="493.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">0%</text><text x="294.0" y="527.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="310.0" y="506.0" width="3.0" height="30.0" fill="#0f7b6c"/><line x1="310.0" y1="521.0" x2="371.2" y2="521.0" stroke="#9a9a9a" stroke-width="1"/><text x="383.2" y="529.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">0%</text><text x="294.0" y="583.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">Opus 4.8</text><rect x="310.0" y="562.0" width="3.0" height="30.0" fill="#c8c8c8"/><line x1="310.0" y1="577.0" x2="371.2" y2="577.0" stroke="#9a9a9a" stroke-width="1"/><text x="383.2" y="585.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">0%</text><text x="294.0" y="619.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="310.0" y="598.0" width="3.0" height="30.0" fill="#0f7b6c"/><line x1="310.0" y1="613.0" x2="371.2" y2="613.0" stroke="#9a9a9a" stroke-width="1"/><text x="383.2" y="621.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">0%</text><text x="840.0" y="214.0" font-size="26" font-weight="600" fill="#111111" text-anchor="start">User&#x27;s task still completed</text><text x="840.0" y="246.0" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="start">higher is better</text><line x1="1070.0" y1="276.0" x2="1070.0" y2="636.0" stroke="#d4d4d4" stroke-width="1"/><text x="1054.0" y="307.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-20B</text><rect x="1070.0" y="286.0" width="285.0" height="30.0" fill="#c8c8c8"/><line x1="1271.9" y1="301.0" x2="1407.5" y2="301.0" stroke="#9a9a9a" stroke-width="1"/><text x="1419.5" y="309.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">75%</text><text x="1054.0" y="343.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="1070.0" y="322.0" width="209.0" height="30.0" fill="#0f7b6c"/><line x1="1200.0" y1="337.0" x2="1351.9" y2="337.0" stroke="#9a9a9a" stroke-width="1"/><text x="1363.9" y="345.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">55%</text><text x="1054.0" y="399.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-120B</text><rect x="1070.0" y="378.0" width="285.0" height="30.0" fill="#c8c8c8"/><line x1="1271.9" y1="393.0" x2="1407.5" y2="393.0" stroke="#9a9a9a" stroke-width="1"/><text x="1419.5" y="401.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">75%</text><text x="1054.0" y="435.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="1070.0" y="414.0" width="114.0" height="30.0" fill="#0f7b6c"/><line x1="1125.3" y1="429.0" x2="1267.2" y2="429.0" stroke="#9a9a9a" stroke-width="1"/><text x="1279.2" y="437.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">30%</text><text x="1054.0" y="491.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">Haiku 4.5</text><rect x="1070.0" y="470.0" width="323.0" height="30.0" fill="#c8c8c8"/><line x1="1313.0" y1="485.0" x2="1430.1" y2="485.0" stroke="#9a9a9a" stroke-width="1"/><text x="1442.1" y="493.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">85%</text><text x="1054.0" y="527.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="1070.0" y="506.0" width="190.0" height="30.0" fill="#0f7b6c"/><line x1="1183.7" y1="521.0" x2="1336.3" y2="521.0" stroke="#9a9a9a" stroke-width="1"/><text x="1348.3" y="529.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">50%</text><text x="1054.0" y="583.6" font-size="19" font-weight="400" fill="#111111" text-anchor="end">Opus 4.8</text><rect x="1070.0" y="562.0" width="323.0" height="30.0" fill="#c8c8c8"/><line x1="1313.0" y1="577.0" x2="1430.1" y2="577.0" stroke="#9a9a9a" stroke-width="1"/><text x="1442.1" y="585.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">85%</text><text x="1054.0" y="619.6" font-size="19" font-weight="500" fill="#111111" text-anchor="end">+ Mirage</text><rect x="1070.0" y="598.0" width="171.0" height="30.0" fill="#0f7b6c"/><line x1="1168.1" y1="613.0" x2="1320.0" y2="613.0" stroke="#9a9a9a" stroke-width="1"/><text x="1332.0" y="621.4" font-size="26" font-weight="600" fill="#111111" text-anchor="start">45%</text></g></svg>
