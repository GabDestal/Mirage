<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>What Mirage stopped on held-out AgentDojo tasks</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="80.0" y="96.0" font-size="44" font-weight="600" fill="#111111" text-anchor="start">What Mirage stopped</text><text x="80.0" y="140.0" font-size="22" font-weight="400" fill="#6b6b6b" text-anchor="start">Held-out AgentDojo tasks, run with Mirage</text><text x="80.0" y="818.0" font-size="21" font-weight="400" fill="#6b6b6b" text-anchor="start">Share of tasks where Mirage stopped at least one of the agent&#x27;s actions.</text><text x="80.0" y="852.0" font-size="21" font-weight="500" fill="#111111" text-anchor="start">Almost every stop comes from one rule: the action used a link or address the user never gave.</text><text x="80.0" y="214.0" font-size="26" font-weight="600" fill="#111111" text-anchor="start">Attacked tasks stopped</text><text x="80.0" y="246.0" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="start">of 20 attacked tasks per model</text><line x1="250.0" y1="286.0" x2="250.0" y2="670.0" stroke="#d4d4d4" stroke-width="1"/><text x="234.0" y="331.7" font-size="19" font-weight="500" fill="#111111" text-anchor="end">GPT-OSS-20B</text><rect x="250.0" y="300.0" width="240.0" height="44.0" fill="#0f7b6c"/><text x="502.0" y="334.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">60%</text><text x="234.0" y="431.7" font-size="19" font-weight="500" fill="#111111" text-anchor="end">GPT-OSS-120B</text><rect x="250.0" y="400.0" width="340.0" height="44.0" fill="#0f7b6c"/><text x="602.0" y="434.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">85%</text><text x="234.0" y="531.7" font-size="19" font-weight="500" fill="#111111" text-anchor="end">Haiku 4.5</text><rect x="250.0" y="500.0" width="140.0" height="44.0" fill="#0f7b6c"/><text x="402.0" y="534.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">35%</text><text x="234.0" y="631.7" font-size="19" font-weight="500" fill="#111111" text-anchor="end">Opus 4.8</text><rect x="250.0" y="600.0" width="140.0" height="44.0" fill="#0f7b6c"/><text x="402.0" y="634.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">35%</text><text x="840.0" y="214.0" font-size="26" font-weight="600" fill="#111111" text-anchor="start">Normal tasks wrongly stopped</text><text x="840.0" y="246.0" font-size="19" font-weight="400" fill="#6b6b6b" text-anchor="start">of 10 normal tasks per model</text><line x1="1010.0" y1="286.0" x2="1010.0" y2="670.0" stroke="#d4d4d4" stroke-width="1"/><text x="994.0" y="331.7" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-20B</text><rect x="1010.0" y="300.0" width="80.0" height="44.0" fill="#c8c8c8"/><text x="1102.0" y="334.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">20%</text><text x="994.0" y="431.7" font-size="19" font-weight="400" fill="#111111" text-anchor="end">GPT-OSS-120B</text><rect x="1010.0" y="400.0" width="160.0" height="44.0" fill="#c8c8c8"/><text x="1182.0" y="434.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">40%</text><text x="994.0" y="531.7" font-size="19" font-weight="400" fill="#111111" text-anchor="end">Haiku 4.5</text><rect x="1010.0" y="500.0" width="160.0" height="44.0" fill="#c8c8c8"/><text x="1182.0" y="534.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">40%</text><text x="994.0" y="631.7" font-size="19" font-weight="400" fill="#111111" text-anchor="end">Opus 4.8</text><rect x="1010.0" y="600.0" width="200.0" height="44.0" fill="#c8c8c8"/><text x="1222.0" y="634.3" font-size="26" font-weight="600" fill="#111111" text-anchor="start">50%</text></g></svg>
