<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>AgentRx critical-step accuracy, with and without Mirage evidence</title><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="80.0" y="96.0" font-size="44" font-weight="600" fill="#111111" text-anchor="start">AgentRx: finding where a failed agent run went wrong</text><text x="80.0" y="140.0" font-size="22" font-weight="400" fill="#6b6b6b" text-anchor="start">Held-out task families · higher is better · 6 failed runs per bar</text><text x="80.0" y="818.0" font-size="21" font-weight="400" fill="#6b6b6b" text-anchor="start">Each case is a recorded agent run that failed; the model must name the step where it broke (no answer = miss).</text><text x="80.0" y="852.0" font-size="21" font-weight="500" fill="#111111" text-anchor="start">Broken step found: GPT-OSS-20B 2/6 → 3/6 with Mirage; Haiku 4.5 3/6 → 0/6 with Mirage.</text><line x1="80.0" y1="700.0" x2="1520.0" y2="700.0" stroke="#d4d4d4" stroke-width="1"/><rect x="150.0" y="553.3" width="220.0" height="146.7" fill="#c8c8c8"/><text x="260.0" y="537.3" font-size="44" font-weight="600" fill="#111111" text-anchor="middle">33%</text><text x="260.0" y="736.0" font-size="20" font-weight="400" fill="#111111" text-anchor="middle">GPT-OSS-20B</text><rect x="440.0" y="480.0" width="220.0" height="220.0" fill="#0f7b6c"/><text x="550.0" y="464.0" font-size="44" font-weight="600" fill="#111111" text-anchor="middle">50%</text><text x="550.0" y="736.0" font-size="20" font-weight="500" fill="#111111" text-anchor="middle">+ Mirage</text><rect x="870.0" y="480.0" width="220.0" height="220.0" fill="#c8c8c8"/><text x="980.0" y="464.0" font-size="44" font-weight="600" fill="#111111" text-anchor="middle">50%</text><text x="980.0" y="736.0" font-size="20" font-weight="400" fill="#111111" text-anchor="middle">Haiku 4.5</text><rect x="1160.0" y="700.0" width="220.0" height="3.