[project]
name = "mirage"
version = "0.1.0"
description = "Incident response for compromised AI agents"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4",
    "langchain-aws>=1.8.1",
    "langgraph>=1.2.14",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "agents", "sdk/tests"]
pythonpath = [".", "sdk"]
